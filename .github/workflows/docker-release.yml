name: Docker release

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ngamesfr1/prerender-alpine
  SMOKE_IMAGE: prerender-alpine:smoke-${{ github.sha }}

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build native smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ env.SMOKE_IMAGE }}
          build-args: SECURITY_REFRESH=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test rendered output and blocked resources
        run: bash .github/smoke/smoke-test.sh "${SMOKE_IMAGE}"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SECURITY_REFRESH=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
